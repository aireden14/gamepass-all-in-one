# Summarizer bot on Fly.io.
# Deploy: fly apps create tg-transcriber-bot, then fly secrets set ..., then fly deploy.
# The bot self-registers its Telegram webhook on startup from WEBHOOK_BASE_URL.
app = "tg-transcriber-bot"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  STATE_DB_PATH = "/data/bot_state.sqlite3"

[mounts]
  source = "bot_state"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
