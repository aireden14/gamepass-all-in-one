app = "vibecod-relay"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  RELAY_DB = "/data/relay.db"

[[mounts]]
  source = "relay_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Всегда живой — это весь смысл релая: он не должен засыпать.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
