; Four services in one container. Each one restarts on its own if it dies,
; so a crashed bot never takes the games down with it.
;
; Logs all go to the container's stdout/stderr (redirect to /dev/fd/1) because
; both Render and Fly collect logs that way; writing to files inside the
; container would just fill the disk with something nobody reads.
;
; TOKEN NAMESPACING — the reason each program has an `environment=` line.
; Separate apps could each own a plain BOT_TOKEN; in one container they share
; a single environment, and two pairs collide head-on:
;   BOT_TOKEN          — gamepass (@Liquid_Chess_bot) vs relay (@Myvibecodbot)
; So the host env carries prefixed names (GAMEPASS_BOT_TOKEN, RELAY_BOT_TOKEN,
; TRANSCRIBER_BOT_TOKEN) and each program is handed the unprefixed name its own
; code already reads. Service source stays untouched.

; Control socket. Without these three sections `supervisorctl status` cannot
; connect, which means no way to inspect or restart a single service inside a
; running container — you would be reduced to redeploying the whole thing.
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
; Do not let one flapping service spin the CPU on a 0.1-core plan.
minfds=1024
minprocs=64

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:gamepass]
; --max-old-space-size caps V8's heap. Without it Node happily grows to
; whatever the host reports, which on a shared 512MB plan means the OOM
; killer takes out the entire container instead of just this process.
command=node --max-old-space-size=220 dist/index.js
directory=/app/services/gamepass
environment=PORT="%(ENV_GAMEPASS_PORT)s",NODE_ENV="production",BOT_TOKEN="%(ENV_GAMEPASS_BOT_TOKEN)s"
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:relay]
command=python -u app.py
directory=/app/services/relay
environment=PORT="%(ENV_RELAY_PORT)s",BOT_TOKEN="%(ENV_RELAY_BOT_TOKEN)s"
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:transcriber]
command=python -u bot.py
directory=/app/services/transcriber
environment=PORT="%(ENV_TRANSCRIBER_PORT)s",TELEGRAM_BOT_TOKEN="%(ENV_TRANSCRIBER_BOT_TOKEN)s"
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; planerdenbot was here. Shut down 2026-08-10 (`fly scale count 0`): a second
; aiogram process costs ~145MB of its own, which alone broke the 512MB budget.
; If it ever comes back, host it inside an existing aiogram process rather than
; adding a new one — aiogram supports several Bot/Dispatcher pairs per process.
